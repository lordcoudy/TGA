services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION_ENCRYPTION_KEY=${TELEGRAM_SESSION_ENCRYPTION_KEY}
      - TELEGRAM_OIDC_CLIENT_ID=${TELEGRAM_OIDC_CLIENT_ID}
      - TELEGRAM_OIDC_CLIENT_SECRET=${TELEGRAM_OIDC_CLIENT_SECRET}
      - TELEGRAM_OIDC_REDIRECT_URI=${TELEGRAM_OIDC_REDIRECT_URI:-http://localhost:3000/api/auth/telegram/callback}
      - DATABASE_URL=postgres://tga:tga@db:5432/tga
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=tga
      - POSTGRES_USER=tga
      - POSTGRES_PASSWORD=tga
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  postgres-data:
